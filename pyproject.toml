[project]
name = "tradeenv"
version = "0.1.0"
description = "Multi-turn trading environment for RL training of LLM agents (bar-replay pilot)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tradeenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
